/* ---------- Modelo de n-gramas (contexto de hasta 4 palabras) ---------- */
const TOK=/'[^']*'?|\d+(?:\.\d+)?|[A-Za-zÀ-ÿ_]\w*|[^\s\w]/g;
const lower=t=>t[0]==="'"?t:t.toLowerCase();
const tokenize=s=>(s.match(TOK)||[]).map(lower);
const N=4,M=[];
for(let k=1;k<=N;k++)M[k]=new Map();
for(const s of CORPUS){
  const t=['<s>',...tokenize(s),';'];
  for(let i=1;i<t.length;i++)for(let k=1;k<=N&&k<=i;k++){
    const key=t.slice(i-k,i).join('\x01');
    let m=M[k].get(key);if(!m)M[k].set(key,m=new Map());
    m.set(t[i],(m.get(t[i])||0)+1);
  }
}

/* ---------- Predicción ---------- */
function parse(text){
  const all=tokenize(text);
  let cur=all.slice(all.lastIndexOf(';')+1),prefix='';
  if(!/\s$/.test(text)&&cur.length){
    const l=cur[cur.length-1];
    if(/^['\w]/.test(l)&&!(l.length>1&&l.endsWith("'"))){prefix=l;cur=cur.slice(0,-1);}
  }
  return{cur,prefix};
}
function schema(cur){
  const al={},tabs=[];
  cur.forEach((t,i)=>{
    if(['from','join','into','update'].includes(t)&&COLS[cur[i+1]]){
      tabs.push(cur[i+1]);
      const a=cur[i+2];
      if(a&&/^[a-z_]\w*$/.test(a)&&!KW.has(a)&&!COLS[a])al[a]=cur[i+1];
    }
  });
  return{al,tabs};
}
function predict(text){
  const{cur,prefix}=parse(text),{al,tabs}=schema(cur);
  const ctx=['<s>',...cur],sc=new Map();
  for(let k=1;k<=N&&k<=ctx.length;k++){
    const m=M[k].get(ctx.slice(-k).join('\x01'));
    if(!m)continue;
    let tot=0;m.forEach(v=>tot+=v);
    m.forEach((v,w)=>sc.set(w,(sc.get(w)||0)+v/tot*Math.pow(4,k)));
  }
  const prev=cur[cur.length-1],before=cur[cur.length-2];
  let allow=null;
  if(prev==='.'){
    const tb=al[before]||(COLS[before]?before:{c:'clientes',p:'pedidos'}[before]);
    if(tb){allow=COLS[tb];allow.forEach(c=>sc.has(c)||sc.set(c,0.01));}
  }
  for(const w of[...sc.keys()]){
    const isCol=ALLCOLS.has(w);
    let drop=false;
    if(prev==='.')drop=allow?!allow.includes(w):!isCol;
    else if(isCol&&tabs.length&&!tabs.some(t=>COLS[t].includes(w)))drop=true;
    if(prefix&&!w.toLowerCase().startsWith(prefix.toLowerCase()))drop=true;
    if(w==='<s>')drop=true;
    if(drop)sc.delete(w);
  }
  let sum=0;sc.forEach(v=>sum+=v);
  const list=[...sc].sort((a,b)=>b[1]-a[1]).slice(0,8).map(([w,v])=>[w,v/sum*100]);
  return{prefix,list};
}

/* ---------- Formato e inserción ---------- */
function isUpper(text){
  const ws=(text.match(/[A-Za-z]+/g)||[]).filter(w=>KW.has(w.toLowerCase()));
  return ws.length?ws[ws.length-1]===ws[ws.length-1].toUpperCase():true;
}
const fmt=(w,up)=>up&&KW.has(w)?w.toUpperCase():w;
function apply(text,prefix,w,up){
  let base=text.slice(0,text.length-prefix.length);
  const t=fmt(w,up);
  if(/^[,.;)]$/.test(t))base=base.replace(/\s+$/,'');
  else if(base&&!/[\s(.]$/.test(base))base+=' ';
  return base+t+(/^[.(]$/.test(t)?'':' ');
}
function complete(text){
  let t=text;const up=isUpper(text);
  for(let i=0;i<40;i++){
    const{prefix,list}=predict(t);
    if(!list.length)break;
    const w=list[0][0];
    t=apply(t,prefix,w,up);
    if(w===';')break;
  }
  return t.trim();
}

/* ---------- Interfaz ---------- */
const ta=document.getElementById('sql'),sug=document.getElementById('sug');
const head=()=>ta.value.slice(0,ta.selectionStart),tail=()=>ta.value.slice(ta.selectionStart);
function setText(newHead,rest){
  ta.value=newHead+rest;
  ta.selectionStart=ta.selectionEnd=newHead.length;
  ta.focus();render();
}
function render(){
  const text=head(),up=isUpper(text),{prefix,list}=predict(text);
  sug.innerHTML='';
  if(!list.length)sug.textContent='Sin sugerencias para este contexto.';
  list.forEach(([w,p])=>{
    const b=document.createElement('button');
    b.type='button';
    b.textContent=fmt(w,up);
    const s=document.createElement('span');s.className='pc';s.textContent=Math.round(p)+'%';b.appendChild(s);
    b.onclick=()=>setText(apply(text,prefix,w,up),tail());
    sug.appendChild(b);
  });
}
ta.addEventListener('input',render);
ta.addEventListener('click',render);
ta.addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))render();});
ta.addEventListener('keydown',e=>{
  if(e.key==='Tab'&&!e.shiftKey){
    const text=head(),{prefix,list}=predict(text);
    if(list.length){e.preventDefault();setText(apply(text,prefix,list[0][0],isUpper(text)),tail());}
  }
});
document.querySelectorAll('.starts button').forEach(b=>b.onclick=()=>setText(b.textContent+' ',''));
render();
</script>
